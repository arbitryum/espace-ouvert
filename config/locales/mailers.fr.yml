# Emails. Each mailer action's subject is picked up by Action Mailer.
fr:
  guide_mailer:
    access_link:
      subject: Votre accès au guide du coworking en EHPAD
      greeting: Bonjour,
      intro: "Voici votre accès au guide du coworking en EHPAD, à destination des EHPAD :"
      cta: Accéder au guide
      validity: Ce lien est valable %{days} jours. Une fois ouvert, le guide reste accessible depuis ce navigateur.
      signature: L'équipe Espace-ouvert
  passwords_mailer:
    reset:
      subject: Choisir un nouveau mot de passe - Espace-ouvert
      greeting: Bonjour,
      intro: "Vous avez demandé à changer le mot de passe de votre compte Espace-ouvert :"
      cta: Choisir un nouveau mot de passe
      validity: "Ce lien est valable %{minutes} minutes. Si vous n'avez rien demandé, ignorez cet email : votre mot de passe reste inchangé."
      signature: L'équipe Espace-ouvert
  admin_invitations_mailer:
    invitation:
      subject: Votre accès administrateur - Espace-ouvert
      greeting: Bonjour,
      intro: "Vous êtes invité à administrer Espace-ouvert. Choisissez votre mot de passe pour activer votre compte :"
      cta: Choisir mon mot de passe
      validity: Ce lien est valable %{days} jours.
      signature: L'équipe Espace-ouvert
  hosting_requests_mailer:
    received:
      subject: "Demande d'accueil : %{organization}"
      greeting: Bonjour,
      intro: "%{organization} souhaite être accueilli dans votre établissement (%{kind})."
      space: "Espace demandé : %{space}"
      contact: Contact
      need: Besoin
      reply: Répondez directement à cet email pour écrire à la structure.
      account: "Acceptez ou refusez la demande depuis votre espace : %{url}"
      account_link: Accepter ou refuser la demande depuis votre espace
      signature: L'équipe Espace-ouvert
    refusal:
      subject: Votre demande à %{care_home}
      greeting: Bonjour %{name},
      intro: >-
        %{care_home} ne peut malheureusement pas accueillir %{organization}
        pour le moment.
      others: "D'autres établissements proposent peut-être des espaces près de chez vous : %{url}"
      others_html: D'autres établissements proposent peut-être des espaces près de chez vous, dans %{link}.
      directory: l'annuaire Espace-ouvert
      signature: L'équipe Espace-ouvert
    acknowledgment:
      subject: Votre demande à %{care_home}
      greeting: Bonjour %{name},
      intro: Votre demande a bien été transmise à %{care_home}.
      next: L'établissement vous répondra directement par email.
      signature: L'équipe Espace-ouvert
