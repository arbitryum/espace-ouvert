# Accounts: sign-in, sign-up, password reset, admin invitations, and the
# requests an establishment answers from its account.
fr:
  sessions:
    new:
      title: Connexion
      eyebrow: Espace établissement
      heading: Bienvenue
      intro: Connectez-vous pour gérer les informations de votre établissement.
      forgot_password: Mot de passe oublié ?
      submit: Se connecter
      or: ou
      register: Référencer un établissement
    create:
      invalid_credentials: Email ou mot de passe incorrect.
      pending_approval: Votre compte est en attente de validation.
      rate_limited: Réessayez plus tard.
  registrations:
    new:
      title: Inscrire un établissement
      heading: Référencer votre établissement
      intro: >-
        Créez votre compte en quelques étapes. Votre demande sera vérifiée avant
        la publication de vos espaces.
      establishment:
        legend: Votre établissement
        help: Son adresse complète nous permet de le placer sur la carte.
      account:
        legend: Le référent du projet
        help: >-
          Il recevra les demandes des structures et y répondra depuis son
          compte, avec cet email et ce mot de passe.
        email_help: Les demandes y seront envoyées. Elle sert aussi à vous connecter.
        password_help: Au moins 8 caractères, sans être uniquement numérique.
      modules:
        legend: Vous souhaitez
        help: Cochez une ou les deux possibilités.
        coworking:
          label: Accueillir une équipe en coworking
          description: Quelques jours par semaine, une petite équipe en coworking dans mon établissement.
        spaces:
          label: Accueillir des activités associatives
          description: Ponctuellement, des activités associatives dans mes espaces.
      coworking:
        legend: Concernant l'accueil d'une équipe en coworking
        "yes": Oui
        "no": Non
        yes_message: >-
          Vous faites désormais partie de notre annuaire d'établissements prêts à
          accueillir une équipe en coworking. Nous ne manquerons pas de vous
          relayer les demandes que nous recevrons pour vous !
        no_message: >-
          Malheureusement, il faut avoir un espace à mettre à disposition pour
          participer à ce projet dans les meilleures conditions.
      spaces:
        legend: Concernant l'accueil d'activités associatives
        intro: Il ne vous reste plus qu'à renseigner les espaces que vous pouvez mettre à disposition.
        space: Espace
        remove: Retirer
        add: Ajouter un espace
        description_hint: Superficie, mobilier sur place…
        slots_hint: Cochez les jours où l'espace est disponible et indiquez les horaires de début et de fin.
        start: Début le %{day}
        end: Fin le %{day}
      photos_hint:
        one: Facultatif, 1 photo au plus (JPEG, PNG, WebP ou HEIC, 15 Mo chacune).
        other: Facultatif, %{count} photos au plus (JPEG, PNG, WebP ou HEIC, 15 Mo chacune).
      photos_again: En cas d'erreur, les photos sont à choisir de nouveau.
      cancel: Annuler
      submit: Envoyer la demande
      next_steps:
        heading: Après votre inscription
        items:
          - Votre demande est envoyée.
          - Notre équipe vérifie les informations.
          - Votre compte est activé après validation.
    create:
      notice: Votre demande a été envoyée. Elle sera examinée par notre équipe.
      coworking_notice: >-
        Vous ferez partie de notre annuaire d'établissements prêts à accueillir une
        équipe en coworking dès sa validation.
    pending:
      title: Demande envoyée
      heading: Demande envoyée
      text: Votre établissement sera visible et accessible après validation par notre équipe.
      back_home: Retour à l'accueil
  passwords:
    invalid_link: Ce lien n'est plus valable. Demandez-en un nouveau.
    new:
      title: Mot de passe oublié
      back: "← Retour à la connexion"
      intro: "Indiquez l'email de votre compte : nous vous envoyons un lien pour choisir un nouveau mot de passe."
      submit: Recevoir le lien
    create:
      notice: Si un compte existe pour cette adresse, vous allez recevoir un email pour choisir un nouveau mot de passe.
      rate_limited: Réessayez plus tard.
    edit:
      title: Nouveau mot de passe
      for_account: Pour %{email}.
      submit: Enregistrer le mot de passe
    update:
      notice: Votre mot de passe a été modifié. Vous pouvez vous connecter.
  invitations:
    invalid_link: Cette invitation n'est plus valable. Demandez-en une nouvelle à un administrateur.
    edit:
      title: Bienvenue
      intro: "Vous êtes invité à administrer Espace-ouvert. Choisissez le mot de passe de votre compte %{email} :"
      submit: Enregistrer le mot de passe
    update:
      notice: Votre mot de passe est enregistré. Bienvenue !
  account:
    hosting_requests:
      no_profile: Cette page est réservée aux comptes établissement validés.
      index:
        title: Mes demandes d'accueil
        intro: Les demandes envoyées à %{care_homes} depuis Espace-ouvert.
        no_care_home: >-
          Aucun établissement n'est encore rattaché à votre compte. Écrivez-nous
          pour que nous le fassions : vous recevrez alors ses demandes ici.
        empty: Aucune demande pour le moment.
        received: Reçue le %{date}
        contact: Contact
        need: Besoin
        accept: Accepter
        refuse: Refuser
        write: Écrire à %{organization}
        accepted_hint: Acceptée le %{date}. Écrivez-leur pour organiser l'accueil.
        refused_hint: Refusée le %{date}. Nous les en avons informés.
      accept:
        notice: "Demande acceptée : %{organization}. Écrivez-leur pour organiser l'accueil."
      refusal:
        title: Refuser la demande de %{organization}
        back: "← Mes demandes"
        intro: >-
          Nous écrirons à %{organization} que vous ne pouvez pas les accueillir
          pour le moment, et leur indiquerons l'annuaire des autres établissements.
        reason: Pourquoi refusez-vous ? (facultatif)
        reason_hint: Pour l'équipe Espace-ouvert uniquement, ce n'est pas transmis à la structure.
        cancel: Annuler
        submit: Refuser la demande
      refuse:
        notice: "Demande refusée : %{organization}. Nous les en avons informés."
      # The email the establishment edits before sending, opened by "Écrire à".
      # [renseigner vos disponibilités] is for the establishment to fill in.
      acceptance_mail:
        subject: Votre demande d'accueil à %{care_home}
        body:
          coworking: |-
            Bonjour %{name},

            Merci pour votre demande ! Nous serions ravis d'échanger avec vous pour en savoir plus sur votre besoin et pourquoi pas organiser une première visite pour que vous puissiez vous projeter dans l'établissement et que nous puissions discuter des conditions d'accueil.

            Je suis disponible : [renseigner vos disponibilités]

            Merci pour votre retour et à bientôt !

            %{signature}
            %{care_home}
          association: |-
            Bonjour %{name},

            Merci pour votre sollicitation ! Nous serions ravis d'accueillir vos activités et d'échanger avec vous pour en savoir plus sur votre besoin (et pourquoi pas organiser une première visite pour que vous puissiez vous projeter dans l'établissement).

            Je suis disponible : [renseigner vos disponibilités]

            Nous pourrons en profiter pour échanger sur les conditions d'accueil.

            Merci pour votre retour et à bientôt !

            %{signature}
            %{care_home}
