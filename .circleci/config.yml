version: 2.1

orbs:
  ruby: circleci/ruby@3.0.0

executors:
  rails:
    docker:
      - &ruby_image
        image: cimg/ruby:3.4.11
        environment:
          BUNDLE_JOBS: 3
          BUNDLE_RETRY: 3
          BUNDLE_PATH: vendor/bundle
          RAILS_ENV: test
          DATABASE_URL: postgresql://espace_ouvert:password@localhost:5432/espace_ouvert_test
  rails_with_postgres:
    docker:
      - *ruby_image
      - image: cimg/postgres:17.11
        environment:
          POSTGRES_USER: espace_ouvert
          POSTGRES_DB: espace_ouvert_test
          POSTGRES_PASSWORD: password

commands:
  remove-old-libvips:
    description: Remove the image's libvips 8.12
    steps:
      - run:
          # Ubuntu 22.04 only ships libvips 8.12, and Active Storage refuses to boot
          # with libvips < 8.13. The tests don't process images, so CI runs without it.
          name: Remove old libvips
          command: sudo apt-get remove -y --purge libvips42 > /dev/null

jobs:
  lint:
    executor: rails
    steps:
      - checkout
      - remove-old-libvips
      - ruby/install-deps
      - run:
          name: Standard
          command: bundle exec standardrb --parallel
      - run:
          name: Brakeman
          command: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - run:
          name: Gem audit
          command: bin/bundler-audit
      - run:
          name: Importmap audit
          command: bin/importmap audit

  rails_test:
    executor: rails_with_postgres
    steps:
      - checkout
      - remove-old-libvips
      - ruby/install-deps
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          # Scalingo boots the new release before its postdeploy hook migrates.
          name: Boot in production on an empty database
          command: RAILS_ENV=production SECRET_KEY_BASE_DUMMY=1 ACTIVE_STORAGE_SERVICE=local bin/rails runner 'puts "booted"'
      - run:
          name: Database setup
          command: bin/rails db:prepare
      - run:
          name: Rails tests
          command: bin/rails test
      - store_artifacts:
          path: log/test.log

workflows:
  build_and_test:
    jobs:
      - lint
      - rails_test:
          requires:
            - lint
